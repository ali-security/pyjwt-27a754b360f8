---
name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed through tox posargs"
        required: false
        default: ""
        type: string

env:
  PIP_INDEX_URL: https://:2024-11-28@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    timeout-minutes: 40
    env:
      USING_COVERAGE: '3.9'

    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "pypy3.9"]

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: "Install dependencies"
        run: |
          python -VV
          python -m site
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox -- ${{ inputs.test-filter }}"

      # We always use a modern Python version for combining coverage to prevent
      # parsing errors in older versions for modern code.
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.9"

      - name: "Combine coverage"
        run: |
          set -xe
          python -m pip install coverage[toml]
          python -m coverage combine
          python -m coverage xml
        if: "contains(env.USING_COVERAGE, matrix.python-version) && matrix.platform == 'ubuntu-latest'"

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 40

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.9"

      - name: "Install build and twine"
        run: |
          python -m pip install "setuptools==75.6.0" build twine
          if python -m pip show wheel >/dev/null 2>&1; then python -m pip uninstall -y wheel; fi

      - name: "Build package"
        run: "python -m build --no-isolation"

      - name: "List result"
        run: "ls -l dist"

      - name: "Check WHEEL generator"
        run: |
          unzip -p dist/*.whl '*.dist-info/WHEEL'
          unzip -p dist/*.whl '*.dist-info/WHEEL' | grep -qx 'Generator: setuptools (75.6.0)'

      - name: "Check long_description"
        run: "python -m twine check dist/*"

      - name: "Upload dist"
        uses: "actions/upload-artifact@v4"
        with:
          name: "dist"
          path: "dist/*"
          if-no-files-found: error

  install-dev:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    name: "Verify dev env"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 40

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.9"

      - name: "Install in dev mode"
        run: "python -m pip install -e .[dev]"

      - name: "Import package"
        run: "python -c 'import jwt; print(jwt.__version__)'"
